[project]
name = "avatar-model-service"
version = "0.1.0"
description = "FastAPI microservice for SAM + SMPL-X 3D avatar generation pipeline."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "trimesh>=4.11.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.10.0",
    "smplx>=0.1.28",
]
cpu = [
    "torch>=2.10.0",
    "smplx>=0.1.28",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
